services:
  postgres:
    image: postgres:16-alpine
    container_name: gymrat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymrat
      POSTGRES_PASSWORD: gymrat
      POSTGRES_DB: gymrat
    ports:
      - '5432:5432'
    volumes:
      - gymrat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymrat -d gymrat']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gymrat-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - gymrat_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gymrat_pg_data:
  gymrat_redis_data:
